[project]
authors = [{name = "Yuxi Liu", email = "yuxi@yuxi.ml"}]
dependencies = []
name = "yuxi.ml"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
yuxi_ml = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
fonttools = ">=4.0"
brotli = ">=1.2.0,<2"
brotli-python = ">=1.2.0,<2"

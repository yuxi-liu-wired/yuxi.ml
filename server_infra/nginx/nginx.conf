# /etc/nginx/nginx.conf
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Normalizes www. to apex
  map $host $canonical_host {
    default $host;
    ~^www\.(?<bare>.+)$ $bare;
  }

  include /etc/nginx/conf.d/*.conf;     # ssl, gzip, etc.
  include /etc/nginx/maps.d/*.conf;     # host and path maps
  include /etc/nginx/maps.d/*.map;
  include /etc/nginx/servers.d/*.conf;  # all server blocks
}

# /etc/nginx/nginx.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # Global I/O and compression
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15s;
  keepalive_requests 1000;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  # ── BASE HREF FOR RELATIVE PATHS ─────────────────────
  # Pages served without trailing slash need <base href> so relative paths
  # (figure/x.png) resolve correctly. Only inject when URI doesn't end in /
  map $request_uri $base_tag {
    default         '<base href="$request_uri/" />';
    "~/$"           '';
    "~\\.html$"     '';
  }

  # ── IMAGE FORMAT NEGOTIATION ──────────────────────────
  # Serve .avif or .webp variants when the browser supports them.
  # Files sit alongside originals: foo.png.avif, foo.png.webp
  map $http_accept $img_suffix {
    default        "";
    "~image/avif"  ".avif";
    "~image/webp"  ".webp";
  }

  # -------- HTTP: ACME + redirect to HTTPS apex --------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yuxi.ml www.yuxi.ml;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 308 https://yuxi.ml$request_uri;
    }
  }

  # -------- HTTPS: canonicalize www -> apex --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic reuseport;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name www.yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    return 308 https://yuxi.ml$request_uri;
  }

  # -------- HTTPS: main site --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/yuxi.ml;
    index index.html;
    error_page 404 /404.html;

    # ── VANITY REDIRECTS ─────────────────────────────────────────
    # Long canonical path → short vanity (query string preserved)
    rewrite ^/essays/posts/cyc/index\.html$ /cyc permanent;
    rewrite ^/essays/posts/cyc/?$ /cyc permanent;

    # ── STRIP TRAILING SLASH ─────────────────────────────────────
    # /foo/ → /foo  (root / excluded by .+; /code paths exempt for autoindex)
    rewrite ^(.+(?<!/code))/$ $1 permanent;

    # ── STRIP index.html ─────────────────────────────────────────
    # /foo/index.html → /foo
    rewrite ^(/.+)/index\.html$ $1 permanent;

    # ── VANITY: /cyc ─────────────────────────────────────────────
    # Serve page directly (figure paths already absolutified by build script)
    location = /cyc {
      sub_filter_once on;
      sub_filter '</head>' '${base_tag}</head>';
      try_files /essays/posts/cyc/index.html =404;
    }

    # Serve /cyc.md → raw .qmd source as text/plain
    location = /cyc.md {
      default_type text/plain;
      try_files /essays/posts/cyc/index.md =404;
    }

    # Serve /cyc/* sub-resources; rewrite to real path then re-match
    # (^~ ensures this beats the static-asset regex below)
    location ^~ /cyc/ {
      rewrite ^/cyc/(.+)$ /essays/posts/cyc/$1 last;
    }

    # ── CODE DIRECTORIES ────────────────────────────────────────
    # Directory listing for paths with no index.html
    # autoindex + try_files: if dir has index.html, serve it; otherwise list files
    location ~ /code(?:/|$) {
      autoindex on;
      try_files $uri $uri/ =404;
    }

    # ── .md SOURCE FILES ─────────────────────────────────────────
    # Serve .md files as plain text (non-vanity pages)
    location ~ \.md$ {
      default_type text/plain;
      try_files $uri =404;
    }

    # ── STATIC ASSET CACHING ─────────────────────────────────────
    # Images: negotiate AVIF > WebP > original via Accept header
    location ~* \.(png|jpe?g|gif)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Vary Accept;
      try_files $uri$img_suffix $uri =404;
    }

    # Other static assets (no negotiation needed)
    location ~* \.(css|js|mjs|json|svg|webp|avif|ico|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      try_files $uri =404;
    }

    # ── DEFAULT ──────────────────────────────────────────────────
    location = /index.html {
      add_header Cache-Control "public, max-age=300";
      add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /404.html {
      internal;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      sub_filter_once on;
      sub_filter '</head>' '${base_tag}</head>';
      try_files $uri $uri/index.html =404;
    }
  }
}

# /etc/nginx/nginx.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # Global I/O and compression
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15s;
  keepalive_requests 1000;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  # -------- HTTP: ACME + redirect to HTTPS apex --------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yuxi.ml www.yuxi.ml;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 308 https://yuxi.ml$request_uri;
    }
  }

  # -------- HTTPS: canonicalize www -> apex --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic reuseport;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name www.yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    return 308 https://yuxi.ml$request_uri;
  }

  # -------- HTTPS: main site --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/yuxi.ml;
    index index.html;
    error_page 404 /404.html;

    # ── VANITY REDIRECTS ─────────────────────────────────────────
    # Long canonical path → short vanity (query string preserved)
    rewrite ^/essays/posts/cyc/index\.html$ /cyc permanent;
    rewrite ^/essays/posts/cyc/?$ /cyc permanent;

    # ── STRIP TRAILING SLASH ─────────────────────────────────────
    # /foo/ → /foo  (root / excluded by .+)
    rewrite ^(.+)/$ $1 permanent;

    # ── STRIP index.html ─────────────────────────────────────────
    # /foo/index.html → /foo
    rewrite ^(/.+)/index\.html$ $1 permanent;

    # ── VANITY: /cyc ─────────────────────────────────────────────
    # Serve page directly; sub_filter fixes relative asset paths
    location = /cyc {
      sub_filter_once off;
      sub_filter 'src="figure/' 'src="/cyc/figure/';
      sub_filter 'href="figure/' 'href="/cyc/figure/';
      sub_filter 'src="code/'   'src="/cyc/code/';
      sub_filter 'href="code/'  'href="/cyc/code/';
      try_files /essays/posts/cyc/index.html =404;
    }

    # Serve /cyc.md → raw .qmd source as text/plain
    location = /cyc.md {
      default_type text/plain;
      try_files /essays/posts/cyc/index.md =404;
    }

    # Serve /cyc/* sub-resources; rewrite to real path then re-match
    # (^~ ensures this beats the static-asset regex below)
    location ^~ /cyc/ {
      rewrite ^/cyc/(.+)$ /essays/posts/cyc/$1 last;
    }

    # ── .md SOURCE FILES ─────────────────────────────────────────
    # Serve .md files as plain text (non-vanity pages)
    location ~ \.md$ {
      default_type text/plain;
      try_files $uri =404;
    }

    # ── STATIC ASSET CACHING ─────────────────────────────────────
    location ~* \.(css|js|mjs|json|png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      try_files $uri =404;
    }

    # ── DEFAULT ──────────────────────────────────────────────────
    location = /index.html {
      add_header Cache-Control "public, max-age=300";
      add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /404.html {
      internal;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}

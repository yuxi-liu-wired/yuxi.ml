# /etc/nginx/nginx.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # -------- HTTP: ACME + redirect to HTTPS apex --------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yuxi.ml www.yuxi.ml;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 308 https://yuxi.ml$request_uri;
    }
  }

  # -------- HTTPS: canonicalize www -> apex --------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    return 308 https://yuxi.ml$request_uri;
  }

  # -------- HTTPS: main site --------
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/yuxi.ml;
    index index.html;

    rewrite ^/essays/posts/cyc/?$ /cyc/ permanent;

    # Redirect long path to short vanity
    location = /cyc { return 308 /cyc/; }

    # Serve short vanity from long directory
    location ^~ /cyc/ {
      alias /var/www/yuxi.ml/essays/posts/cyc/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # Default static handling
    location / {
      try_files $uri $uri/ =404;
    }
  }
}

# /etc/nginx/nginx.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;

  # Global I/O and compression
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15s;
  keepalive_requests 1000;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  # strip index.html: map original request URI to redirect target
  # only fires when the *client* actually requested index.html, not internal index resolution
  map $request_uri $strip_index {
    default "";
    ~^(/.+)/index\.html(?:\?.*)?$ $1/;
  }

  # -------- HTTP: ACME + redirect to HTTPS apex --------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yuxi.ml www.yuxi.ml;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      return 308 https://yuxi.ml$request_uri;
    }
  }

  # -------- HTTPS: canonicalize www -> apex --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic reuseport;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name www.yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    return 308 https://yuxi.ml$request_uri;
  }

  # -------- HTTPS: main site --------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yuxi.ml;

    ssl_certificate     /etc/nginx/ssl/yuxi.ml.crt;
    ssl_certificate_key /etc/nginx/ssl/yuxi.ml.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/yuxi.ml;
    index index.html;
    error_page 404 /404.html;

    # TTL static assets for 30 days
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
      try_files $uri =404;
    }

    # strip index.html from client-facing URLs
    if ($strip_index) {
      return 301 $strip_index;
    }

    # -------- vanity slugs --------
    # pattern: rewrite long->short, then serve short via try_files

    rewrite ^/essays/posts/serial-experiments-lain/?$                 /lain/ permanent;
    location = /lain { return 308 /lain/; }
    location ~ ^/lain/(.*)$ { try_files /essays/posts/serial-experiments-lain/$1 /essays/posts/serial-experiments-lain/$1/index.html =404; }

    rewrite ^/essays/posts/cybernetic-artificial-intelligence/?$      /cybernetic-ai/ permanent;
    location = /cybernetic-ai { return 308 /cybernetic-ai/; }
    location ~ ^/cybernetic-ai/(.*)$ { try_files /essays/posts/cybernetic-artificial-intelligence/$1 /essays/posts/cybernetic-artificial-intelligence/$1/index.html =404; }

    rewrite ^/essays/posts/perplexity-turing-test/?$                 /turing-test/ permanent;
    location = /turing-test { return 308 /turing-test/; }
    location ~ ^/turing-test/(.*)$ { try_files /essays/posts/perplexity-turing-test/$1 /essays/posts/perplexity-turing-test/$1/index.html =404; }

    rewrite ^/essays/posts/grokking-modular-arithmetics/?$           /grokking/ permanent;
    location = /grokking { return 308 /grokking/; }
    location ~ ^/grokking/(.*)$ { try_files /essays/posts/grokking-modular-arithmetics/$1 /essays/posts/grokking-modular-arithmetics/$1/index.html =404; }

    rewrite ^/essays/posts/no-nonsense-algorithmic-bias/?$           /algorithmic-bias/ permanent;
    location = /algorithmic-bias { return 308 /algorithmic-bias/; }
    location ~ ^/algorithmic-bias/(.*)$ { try_files /essays/posts/no-nonsense-algorithmic-bias/$1 /essays/posts/no-nonsense-algorithmic-bias/$1/index.html =404; }

    rewrite ^/essays/posts/perfect-diffusion-tc0-bad-diffusion-tc/?$ /diffusion-complexity/ permanent;
    location = /diffusion-complexity { return 308 /diffusion-complexity/; }
    location ~ ^/diffusion-complexity/(.*)$ { try_files /essays/posts/perfect-diffusion-tc0-bad-diffusion-tc/$1 /essays/posts/perfect-diffusion-tc0-bad-diffusion-tc/$1/index.html =404; }

    rewrite ^/essays/posts/reading-perceptron-book/?$                /perceptrons/ permanent;
    location = /perceptrons { return 308 /perceptrons/; }
    location ~ ^/perceptrons/(.*)$ { try_files /essays/posts/reading-perceptron-book/$1 /essays/posts/reading-perceptron-book/$1/index.html =404; }

    rewrite ^/essays/posts/mixture-of-experts/?$                     /moe/ permanent;
    location = /moe { return 308 /moe/; }
    location ~ ^/moe/(.*)$ { try_files /essays/posts/mixture-of-experts/$1 /essays/posts/mixture-of-experts/$1/index.html =404; }

    rewrite ^/essays/posts/perceptron-controversy/?$                 /perceptron-controversy/ permanent;
    location = /perceptron-controversy { return 308 /perceptron-controversy/; }
    location ~ ^/perceptron-controversy/(.*)$ { try_files /essays/posts/perceptron-controversy/$1 /essays/posts/perceptron-controversy/$1/index.html =404; }

    rewrite ^/essays/posts/backstory-of-backpropagation/?$           /backprop/ permanent;
    location = /backprop { return 308 /backprop/; }
    location ~ ^/backprop/(.*)$ { try_files /essays/posts/backstory-of-backpropagation/$1 /essays/posts/backstory-of-backpropagation/$1/index.html =404; }

    rewrite ^/essays/posts/hole-argument-inverted-qualia/?$          /qualia/ permanent;
    location = /qualia { return 308 /qualia/; }
    location ~ ^/qualia/(.*)$ { try_files /essays/posts/hole-argument-inverted-qualia/$1 /essays/posts/hole-argument-inverted-qualia/$1/index.html =404; }

    rewrite ^/essays/posts/neural-scaling-laws-fermi-estimate/?$     /scaling-fermi/ permanent;
    location = /scaling-fermi { return 308 /scaling-fermi/; }
    location ~ ^/scaling-fermi/(.*)$ { try_files /essays/posts/neural-scaling-laws-fermi-estimate/$1 /essays/posts/neural-scaling-laws-fermi-estimate/$1/index.html =404; }

    rewrite ^/essays/posts/renormalization-how-to/?$                 /renormalization/ permanent;
    location = /renormalization { return 308 /renormalization/; }
    location ~ ^/renormalization/(.*)$ { try_files /essays/posts/renormalization-how-to/$1 /essays/posts/renormalization-how-to/$1/index.html =404; }

    rewrite ^/essays/posts/wigner-rotation/?$                        /wigner/ permanent;
    location = /wigner { return 308 /wigner/; }
    location ~ ^/wigner/(.*)$ { try_files /essays/posts/wigner-rotation/$1 /essays/posts/wigner-rotation/$1/index.html =404; }

    rewrite ^/essays/posts/statistical-mechanics/?$                  /statmech/ permanent;
    location = /statmech { return 308 /statmech/; }
    location ~ ^/statmech/(.*)$ { try_files /essays/posts/statistical-mechanics/$1 /essays/posts/statistical-mechanics/$1/index.html =404; }

    rewrite ^/essays/posts/analytical-mechanics/?$                   /mechanics/ permanent;
    location = /mechanics { return 308 /mechanics/; }
    location ~ ^/mechanics/(.*)$ { try_files /essays/posts/analytical-mechanics/$1 /essays/posts/analytical-mechanics/$1/index.html =404; }

    rewrite ^/essays/posts/structure-interpretation-chinese-economy/?$ /china-economy/ permanent;
    location = /china-economy { return 308 /china-economy/; }
    location ~ ^/china-economy/(.*)$ { try_files /essays/posts/structure-interpretation-chinese-economy/$1 /essays/posts/structure-interpretation-chinese-economy/$1/index.html =404; }

    rewrite ^/essays/posts/equilibrium-thermoeconomics/?$            /thermoeconomics/ permanent;
    location = /thermoeconomics { return 308 /thermoeconomics/; }
    location ~ ^/thermoeconomics/(.*)$ { try_files /essays/posts/equilibrium-thermoeconomics/$1 /essays/posts/equilibrium-thermoeconomics/$1/index.html =404; }

    rewrite ^/essays/posts/cyc/?$                                    /cyc/ permanent;
    location = /cyc { return 308 /cyc/; }
    location ~ ^/cyc/(.*)$ { try_files /essays/posts/cyc/$1 /essays/posts/cyc/$1/index.html =404; }

    # Default static handling
    location = /index.html {
      add_header Cache-Control "public, max-age=300";
    }
    location = /404.html {
      internal;  # prevents direct access counting as 200
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      try_files $uri $uri/ =404;
    }
    
  }
}

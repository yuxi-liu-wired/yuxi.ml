# /etc/nginx/servers.d/00-http-redirect.conf
# One HTTP server for everything: ACME allowed, then redirect to HTTPS on canonical host.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  include /etc/nginx/snippets/acme-challenge.conf;

  return 308 https://$canonical_host$request_uri;
}

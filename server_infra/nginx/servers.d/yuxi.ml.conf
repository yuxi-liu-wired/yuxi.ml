# /etc/nginx/servers.d/yuxi.ml.conf
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yuxi.ml;
  include /etc/nginx/snippets/ssl-yuxi.ml.conf;
  include /etc/nginx/snippets/acme-challenge.conf;

  root /var/www/yuxi.ml;
  index index.html;

  location / {
    # order preserved: external redirect -> add slash -> vanity rewrite -> serve -> 404
    try_files $loc_extredir $loc_slash $loc_vanity $uri $uri/ =404;
  }

  location @extredir { return 308 $yuxi_redirect; }
  location @slash    { return 308 $request_uri/; }
  location @vanity   { rewrite ^/[^/]+(?:/(.*))?$ $vanity_target/$1 last; }
}

# /etc/nginx/servers.d/yuxi.ml.conf
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yuxi.ml;
  include /etc/nginx/snippets/ssl-yuxi.ml.conf;
  include /etc/nginx/snippets/acme-challenge.conf;

  root /var/www/yuxi.ml;
  index index.html;

  # Optional bulk path redirects via map (see maps.d/yuxi-redirects.map)
  # if ($yuxi_redirect) { return 308 $yuxi_redirect; }

  location / { try_files $uri $uri/ =404; }
}

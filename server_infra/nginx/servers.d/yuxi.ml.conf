# /etc/nginx/servers.d/yuxi.ml.conf
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name yuxi.ml;
  include /etc/nginx/snippets/ssl-yuxi.ml.conf;
  include /etc/nginx/snippets/acme-challenge.conf;

  root /var/www/yuxi.ml;
  index index.html;

  # 1) External 308 redirects (one-offs, aliases, deep->vanity)
  if ($yuxi_redirect) { return 308 $yuxi_redirect; }

  # 2) Vanity slugs -> deep folders (internal rewrite)
  #    Force trailing slash for proper relative asset resolution.
  if ($vanity_target) {
    if ($request_uri ~ ^/[^/]+$) { return 308 $request_uri/; }
    rewrite ^/[^/]+(?:/(.*))?$ $vanity_target/$1 last;
  }

  location / { try_files $uri $uri/ =404; }
}

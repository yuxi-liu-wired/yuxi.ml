## Local-test mirror of nginx.conf
## No SSL, no http2/quic — works with any nginx version.
## Usage:  sudo nginx -c $(pwd)/server_infra/nginx/test-local.conf
##         curl -sI http://localhost:8787/essays/posts/cyc/index.html

worker_processes 1;
pid /tmp/nginx-test.pid;
error_log /tmp/nginx-test-error.log;

events { worker_connections 64; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  access_log /tmp/nginx-test-access.log;

  root /var/www/yuxi.ml;
  index index.html;

  # strip index.html: map original request URI to redirect target
  # only fires when the *client* actually requested index.html, not internal index resolution
  map $request_uri $strip_index {
    default "";
    ~^(/.+)/index\.html(?:\?.*)?$ $1/;
  }

  server {
    listen 8787;
    server_name localhost;
    error_page 404 /404.html;

    # strip index.html from client-facing URLs
    if ($strip_index) {
      return 301 $strip_index;
    }

    # redirect long paths to vanity
    rewrite ^/essays/posts/cyc/?$ /cyc/ permanent;

    # vanity: /cyc/ serves content from /essays/posts/cyc/ via try_files remapping
    location = /cyc { return 308 /cyc/; }
    location ~ ^/cyc/(.*)$ {
      try_files /essays/posts/cyc/$1 /essays/posts/cyc/$1/index.html =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}

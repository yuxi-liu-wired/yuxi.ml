## Local-test mirror of production nginx.conf
## No SSL, no http2/quic — plain HTTP on port 8080.
## Usage:  nginx -c /workspace/yuxi.ml/server_infra/nginx/test-local.conf
##         bash /workspace/yuxi.ml/server_infra/nginx/test-nginx.sh

worker_processes 1;
pid /tmp/nginx-test.pid;
error_log /tmp/nginx-test-error.log info;

events { worker_connections 64; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /tmp/nginx-test-access.log;

  # Unprivileged temp dirs (no sudo needed)
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name localhost;

    root /tmp/www/yuxi.ml;
    index index.html;
    error_page 404 /404.html;

    # ── VANITY REDIRECTS ─────────────────────────────────────────
    # Long canonical path → short vanity (query string preserved by default)
    rewrite ^/essays/posts/cyc/index\.html$ /cyc permanent;
    rewrite ^/essays/posts/cyc/?$ /cyc permanent;

    # ── STRIP TRAILING SLASH ─────────────────────────────────────
    # /foo/ → /foo  (root / is excluded by .+ requiring ≥1 char)
    rewrite ^(.+)/$ $1 permanent;

    # ── STRIP index.html ─────────────────────────────────────────
    # /foo/index.html → /foo
    rewrite ^(/.+)/index\.html$ $1 permanent;

    # ── VANITY: /cyc ─────────────────────────────────────────────
    # Serve page directly; sub_filter fixes relative paths
    # (without trailing slash, browser resolves figure/x.png → /figure/x.png)
    location = /cyc {
      sub_filter_once off;
      sub_filter 'src="figure/' 'src="/cyc/figure/';
      sub_filter 'href="figure/' 'href="/cyc/figure/';
      sub_filter 'src="code/'   'src="/cyc/code/';
      sub_filter 'href="code/'  'href="/cyc/code/';
      try_files /essays/posts/cyc/index.html =404;
    }

    # Serve /cyc.md → raw .qmd source as text/plain
    location = /cyc.md {
      default_type text/plain;
      try_files /essays/posts/cyc/index.md =404;
    }

    # Serve /cyc/* sub-resources; rewrite to real path then re-match
    # (^~ ensures this beats any static-asset regex)
    location ^~ /cyc/ {
      rewrite ^/cyc/(.+)$ /essays/posts/cyc/$1 last;
    }

    # ── .md SOURCE FILES ─────────────────────────────────────────
    # Serve .md files as plain text (non-vanity pages)
    location ~ \.md$ {
      default_type text/plain;
      try_files $uri =404;
    }

    # ── DEFAULT ──────────────────────────────────────────────────
    location = /404.html {
      internal;
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}

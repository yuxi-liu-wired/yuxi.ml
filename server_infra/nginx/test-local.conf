## Local-test mirror of production nginx.conf
## No SSL, no http2/quic — plain HTTP on port 8080.
## Usage:  nginx -c /workspace/yuxi.ml/server_infra/nginx/test-local.conf
##         bash /workspace/yuxi.ml/server_infra/nginx/test-nginx.sh

worker_processes 1;
pid /tmp/nginx-test.pid;
error_log /tmp/nginx-test-error.log info;

events { worker_connections 64; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /tmp/nginx-test-access.log;

  # ── BASE HREF FOR RELATIVE PATHS ─────────────────────
  # Pages served without trailing slash need <base href> so relative paths
  # (figure/x.png) resolve correctly. Only inject when URI doesn't end in /
  map $request_uri $base_tag {
    default         '<base href="$request_uri/" />';
    "~/$"           '';
    "~\\.html$"     '';
  }

  # ── IMAGE FORMAT NEGOTIATION ──────────────────────────
  map $http_accept $img_suffix {
    default        "";
    "~image/avif"  ".avif";
    "~image/webp"  ".webp";
  }

  # Unprivileged temp dirs (no sudo needed)
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name localhost;

    root /tmp/www/yuxi.ml;
    index index.html;
    error_page 404 /404.html;

    # ── VANITY REDIRECTS ─────────────────────────────────────────
    # Long canonical path → short vanity (query string preserved by default)
    rewrite ^/essays/posts/cyc/index\.html$ /cyc permanent;
    rewrite ^/essays/posts/cyc/?$ /cyc permanent;

    # ── STRIP TRAILING SLASH ─────────────────────────────────────
    # /foo/ → /foo  (root / excluded by .+; /code paths exempt for autoindex)
    rewrite ^(.+(?<!/code))/$ $1 permanent;

    # ── STRIP index.html ─────────────────────────────────────────
    # /foo/index.html → /foo
    rewrite ^(/.+)/index\.html$ $1 permanent;

    # ── VANITY: /cyc ─────────────────────────────────────────────
    # Serve page directly (figure paths already absolutified by build script)
    location = /cyc {
      sub_filter_once on;
      sub_filter '</head>' '${base_tag}</head>';
      try_files /essays/posts/cyc/index.html =404;
    }

    # Serve /cyc.md → raw .qmd source as text/plain
    location = /cyc.md {
      default_type text/plain;
      try_files /essays/posts/cyc/index.md =404;
    }

    # Serve /cyc/* sub-resources; rewrite to real path then re-match
    # (^~ ensures this beats any static-asset regex)
    location ^~ /cyc/ {
      rewrite ^/cyc/(.+)$ /essays/posts/cyc/$1 last;
    }

    # ── CODE DIRECTORIES ────────────────────────────────────────
    location ~ /code(?:/|$) {
      autoindex on;
      try_files $uri $uri/ =404;
    }

    # ── .md SOURCE FILES ─────────────────────────────────────────
    # Serve .md files as plain text (non-vanity pages)
    location ~ \.md$ {
      default_type text/plain;
      # /foo.md → try /foo.md, then /foo/index.md (for pages like /docs/posts/nick-land.md)
      rewrite ^(.+)\.md$ $1/index.md break;
      try_files $uri =404;
    }

    # ── IMAGE FORMAT NEGOTIATION ───────────────────────────────
    location ~* \.(png|jpe?g|gif)$ {
      add_header Vary Accept;
      try_files $uri$img_suffix $uri =404;
    }

    # ── DEFAULT ──────────────────────────────────────────────────
    location = /404.html {
      internal;
    }

    location / {
      # When serving $uri/index.html for a directory, inject <base href>
      # so relative paths resolve correctly without trailing slashes.
      sub_filter_once on;
      sub_filter '</head>' '${base_tag}</head>';
      try_files $uri $uri/index.html =404;
    }
  }
}
